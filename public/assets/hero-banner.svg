  <path d="M565 620C650 540 748 492 830 466c94-29 194-37 278-27 61 7 111 20 162 37-54 38-114 71-185 97-76 28-166 47-262 53-118 7-201 1-258-6Z" fill="#0a0d15" opacity="0.75"/>
  <path d="M0 470C122 448 239 447 360 431c120-15 201-48 309-46 80 1 144 25 214 44 96 25 186 25 281 5 72-15 135-40 209-40 82 0 161 22 227 48v138H0Z" fill="url(#mist)" opacity="0.6"/>

