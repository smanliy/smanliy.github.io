  <g transform="translate(365 330) scale(1.08)" filter="url(#softShadow)">
    <path d="M110 215c-37-11-62-42-68-80-7-46 13-91 54-115 17-10 38-16 59-16 19 0 38 4 54 13 19 11 33 29 41 50-12 9-19 22-21 38-3 29 11 54 35 69-17 21-44 37-76 37-10 0-19-1-29-4-1 3-2 6-3 8-5 0-10 0-16 0-8 0-21 0-30 0Z" fill="url(#wolf)"/>
    <path d="M97 53 67 22l7 48c-9 9-15 20-18 32l38-5c4-16 15-31 30-44Z" fill="#8f8897"/>
    <path d="M217 49 247 18l-8 48c9 9 15 20 18 32l-38-5c-4-16-15-31-30-44Z" fill="#a7a0ac"/>
    <path d="M77 109c6-20 20-35 39-42 13-5 27-7 41-4 15 3 28 11 38 23 8 9 13 20 14 32 2 15-2 29-11 41-10 14-23 23-39 28-24 7-48 3-67-12-19-14-28-35-15-66Z" fill="#dbd6de"/>
    <path d="M88 113c4-13 13-23 27-27 10-4 21-4 32-1 12 4 21 12 26 24 4 8 5 17 4 26-2 12-8 22-17 30-9 7-21 12-34 13-18 2-32-3-43-14-11-11-16-28-13-51Z" fill="#f1ebef"/>
    <path d="M101 123c3-8 9-14 17-17 6-2 13-3 20-1 8 2 14 7 18 14 3 5 5 11 4 17-2 8-6 14-12 19-6 5-14 7-22 8-13 2-23-2-30-11-7-7-9-17-7-29Z" fill="#1a1824"/>
    <circle cx="120" cy="131" r="4.5" fill="#f6f0f5"/>
    <circle cx="156" cy="131" r="4.5" fill="#f6f0f5"/>
    <path d="M127 152c8 4 17 4 25 0" fill="none" stroke="#5c3540" stroke-width="4" stroke-linecap="round"/>
    <path d="M129 183c10 6 21 9 33 9 10 0 19-2 29-7" fill="none" stroke="#d57c92" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M76 207c23-8 46-12 71-12s49 4 72 12" fill="none" stroke="#b76a80" stroke-width="7" stroke-linecap="round"/>
    <path d="M108 219c26-7 53-7 79 0" fill="none" stroke="#e6a2b0" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
    <path d="M54 226c22-5 43-5 63 0" fill="none" stroke="#2c2f40" stroke-width="8" stroke-linecap="round"/>
    <path d="M220 70c13 4 24 12 31 23" fill="none" stroke="#f2c3b9" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M33 70c10 11 19 24 22 40" fill="none" stroke="#f2c3b9" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Leaves -->
  <g fill="#d59a79" opacity="0.85">
