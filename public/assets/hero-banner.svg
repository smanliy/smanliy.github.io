    <path d="M520 560c7-14 18-19 30-17-4 10-2 20 8 29-15 3-28 0-38-12Z"/>
    <path d="M1260 518c8-15 20-21 32-18-4 11-2 21 8 31-16 3-29 0-40-13Z"/>
    <path d="M1350 548c7-14 18-19 30-17-4 10-2 20 8 29-15 3-28 0-38-12Z"/>
