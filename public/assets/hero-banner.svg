  <g opacity="0.45" fill="#f0c5a1">
    <circle cx="650" cy="158" r="3"/>
    <circle cx="702" cy="132" r="2"/>
    <circle cx="912" cy="212" r="2.6"/>
    <circle cx="1202" cy="228" r="3"/>
  </g>
</svg>
